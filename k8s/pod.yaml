apiVersion: v1 # Based On Type Of Object version 
kind: Pod # Type Of Object 
metadata: # Data about data
  name: nginx-pod # Name Of Pod
spec:
  containers:
  - name: nginx-container # Name Of Container
    image: nginx # Image 
    ports: # Port Which Contaoner Runs On 
    - containerPort: 80

# kubectl run nginx-pod --image nginx --port=80 
